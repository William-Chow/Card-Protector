name: CI

# The redaction engine is this app's whole value, and it is guarded by a test
# suite — parity against the shipped card masker, a monotonicity property, a
# run-ceiling property, a false-positive corpus — that nothing was running
# automatically. A privacy regression here is silent by nature: the output still
# looks masked. This is the gate that makes the suite mean something.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No signing config is needed: key.properties is absent on CI, and
      # app/build.gradle already skips the release signingConfig when it is.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

  leaked-secrets:
    name: No signing material in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A keystore and a Play encryption key were committed to this repository
      # once. This is cheap enough to run forever so it cannot happen twice.
      - name: Fail if a key or a bundle is tracked
        run: |
          tracked=$(git ls-files -- \
            '*.jks' '*.keystore' '*.pepk' '*.p12' '*.aab' '*.apk' \
            'app/keystore/*' 'key.properties')
          if [ -n "$tracked" ]; then
            echo "::error::signing material or build output is tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "clean"
